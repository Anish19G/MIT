{% extends 'base.html' %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-3">Register</h3>
          <form method="post">
            <div class="mb-3">
              <label class="form-label">Username</label>
              <input class="form-control" name="username" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input class="form-control" name="password" type="password" required>
              <div class="form-text">At least 6 characters.</div>
            </div>
            <div class="mb-3">
              <label class="form-label">Transaction limit</label>
              <input class="form-control" name="limit" type="number" step="0.01" value="1000">
            </div>
            <div class="mb-3">
              <label class="form-label">Home location (city)</label>
              <input class="form-control" name="location">
            </div>
            <button class="btn btn-primary" type="submit">Register</button>
            <a class="btn btn-link" href="{{ url_for('login') }}">Already have an account? Login</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
