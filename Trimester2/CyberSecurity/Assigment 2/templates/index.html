{% extends 'base.html' %}
{% block content %}
  {% if user %}
    <p>Welcome, {{user['username']}} — <a href="{{ url_for('dashboard') }}">Dashboard</a> | <a href="{{ url_for('logout') }}">Logout</a></p>
  {% else %}
    <p><a href="{{ url_for('login') }}">Login</a> or <a href="{{ url_for('register') }}">Register</a></p>
  {% endif %}
{% endblock %}
