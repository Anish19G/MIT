{% extends 'base.html' %}
{% block content %}
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-sm">
        <div class="card-body">
          <h3 class="card-title mb-3">Enter OTP</h3>
          <p class="text-muted">An OTP was generated and printed to the server console for this demo. Enter it below to approve the pending transaction.</p>
          <form method="post">
            <div class="mb-3">
              <label class="form-label">OTP</label>
              <input class="form-control" name="code" required>
            </div>
            <button class="btn btn-primary" type="submit">Verify</button>
            <a class="btn btn-link" href="{{ url_for('dashboard') }}">Cancel</a>
          </form>
        </div>
      </div>
    </div>
  </div>
{% endblock %}
