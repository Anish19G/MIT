{% extends 'base.html' %}
{% block content %}
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="mb-0">Transaction History</h3>
    <a class="btn btn-secondary" href="{{ url_for('dashboard') }}">Back</a>
  </div>
  <div class="table-responsive">
    <table class="table table-striped">
      <thead><tr><th>ID</th><th>Amount</th><th>Merchant</th><th>Status</th><th>Date</th></tr></thead>
      <tbody>
        {% for t in transactions %}
          <tr>
            <td>{{ t.id }}</td>
            <td>${{ '%.2f'|format(t.amount) }}</td>
            <td>{{ t.merchant }}</td>
            <td><span class="badge bg-{{ 'success' if t.status=='approved' else 'danger' }} status-badge">{{ t.status }}</span></td>
            <td>{{ t.created_at }}</td>
          </tr>
        {% else %}
          <tr><td colspan="5">No transactions yet.</td></tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
{% endblock %}
