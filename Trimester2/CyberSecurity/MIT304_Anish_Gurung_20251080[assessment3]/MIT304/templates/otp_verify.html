{% extends 'base.html' %}
{% block content %}
<h2>Verify OTP</h2>
<p>OTP code (for demo) : <strong>{{ otp_code }}</strong> (expires {{ expires_at }})</p>
<form method="post" action="{{ url_for('verify_otp') }}">
  <div class="mb-3">
    <label class="form-label">OTP Code</label>
    <input class="form-control" name="otp_code" required>
  </div>
  <button class="btn btn-primary" type="submit">Verify</button>
</form>
{% endblock %}
